# BUMI3 部署观测与控制契约；模型和机器人资产均位于 gear_sonic_deploy 内。
# BUMI3 SONIC sim2sim 的完整运行契约。本配置把训练侧的时间参数、21 自由度顺序、
# 初始姿态、PD 增益、力矩/速度上限、armature 和动作缩放规则集中在一个可审计文件中。
# Python 运行器会按关节名称解析 MuJoCo 地址，绝不假设 qpos[7:] 与策略顺序相同；
# 启动时还会逐项验证配置、MJCF 和 ONNX 的维度，防止资产或 checkpoint 静默错配。
# 部署运行时将 21 个驱动关节统一覆盖为 armature=0.01，浮动根保持 0。
# XML 被动关节阻尼为 4340 资产的 0.001；下方 damping 字段仍只表示显式 PD 的 Kd。

robot_type: bumi3
model_path: ../../bumi3/bumi3.xml

simulation:
  sim_dt: 0.005
  decimation: 4
  target_fps: 50
  # 仅在动作不含 root translation 时使用；0.4744 m 对应默认站姿脚底刚好接近地面。
  # 正常 SONIC PKL/NPZ/CSV 会优先使用参考动作首帧的 root position。
  initial_root_position: [0.0, 0.0, 0.4744]
  initial_root_quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  align_reference_heading: true

sonic:
  history_length: 10
  num_future_frames: 10
  dt_future_ref_frames: 0.1
  future_frame_stride: 5
  token_dim: 64
  actor_proprioception_dim: 690
  robot_tokenizer_dim: 480
  combined_policy_input_dim: 1170
  action_dim: 21
  action_clip: 20.0
  anchor_body_name: base_link
  reference_root_body_name: base_link
  policy_encoder_name: g1

# MuJoCo 模型中的 21 个 hinge 顺序；root freejoint 不属于策略动作。
mujoco_joint_names:
  - waist_yaw_joint
  - l_arm_pitch_joint
  - l_arm_roll_joint
  - l_arm_yaw_joint
  - l_elbow_pitch_joint
  - r_arm_pitch_joint
  - r_arm_roll_joint
  - r_arm_yaw_joint
  - r_elbow_pitch_joint
  - l_leg_pitch_joint
  - l_leg_roll_joint
  - l_leg_yaw_joint
  - l_knee_pitch_joint
  - l_ankle_pitch_joint
  - l_ankle_roll_joint
  - r_leg_pitch_joint
  - r_leg_roll_joint
  - r_leg_yaw_joint
  - r_knee_pitch_joint
  - r_ankle_pitch_joint
  - r_ankle_roll_joint

# SONIC/Isaac Lab 的策略输入与输出顺序；内部 encoder 键名仍为 g1 以兼容 checkpoint。
policy_joint_names:
  - l_leg_pitch_joint
  - r_leg_pitch_joint
  - waist_yaw_joint
  - l_leg_roll_joint
  - r_leg_roll_joint
  - l_arm_pitch_joint
  - r_arm_pitch_joint
  - l_leg_yaw_joint
  - r_leg_yaw_joint
  - l_arm_roll_joint
  - r_arm_roll_joint
  - l_knee_pitch_joint
  - r_knee_pitch_joint
  - l_arm_yaw_joint
  - r_arm_yaw_joint
  - l_ankle_pitch_joint
  - r_ankle_pitch_joint
  - l_elbow_pitch_joint
  - r_elbow_pitch_joint
  - l_ankle_roll_joint
  - r_ankle_roll_joint

default_joint_positions:
  waist_yaw_joint: 0.0
  l_arm_pitch_joint: 0.0
  l_arm_roll_joint: 0.3
  l_arm_yaw_joint: 0.0
  l_elbow_pitch_joint: 0.0
  r_arm_pitch_joint: 0.0
  r_arm_roll_joint: -0.3
  r_arm_yaw_joint: 0.0
  r_elbow_pitch_joint: 0.0
  l_leg_pitch_joint: -0.1495
  l_leg_roll_joint: 0.0
  l_leg_yaw_joint: 0.0
  l_knee_pitch_joint: 0.3215
  l_ankle_pitch_joint: -0.172
  l_ankle_roll_joint: 0.0
  r_leg_pitch_joint: -0.1495
  r_leg_roll_joint: 0.0
  r_leg_yaw_joint: 0.0
  r_knee_pitch_joint: 0.3215
  r_ankle_pitch_joint: -0.172
  r_ankle_roll_joint: 0.0

# action_scale 始终由 0.25 * effort_limit / stiffness 计算，不复制一组难以追溯的常量。
action_scale_formula: 0.25 * effort_limit / stiffness

actuator_groups:
  leg_yaw:
    joint_names: [l_leg_yaw_joint, r_leg_yaw_joint]
    effort_limit: 12.0
    velocity_limit: 12.0
    stiffness: 20.0
    damping: 1.0
    armature: 0.01
  leg_roll:
    joint_names: [l_leg_roll_joint, r_leg_roll_joint]
    effort_limit: 50.0
    velocity_limit: 12.0
    stiffness: 45.0
    damping: 3.0
    armature: 0.01
  leg_pitch:
    joint_names: [l_leg_pitch_joint, r_leg_pitch_joint]
    effort_limit: 50.0
    velocity_limit: 12.0
    stiffness: 45.0
    damping: 3.0
    armature: 0.01
  knee_pitch:
    joint_names: [l_knee_pitch_joint, r_knee_pitch_joint]
    effort_limit: 50.0
    velocity_limit: 12.0
    stiffness: 45.0
    damping: 2.0
    armature: 0.01
  waist:
    joint_names: [waist_yaw_joint]
    effort_limit: 27.0
    velocity_limit: 9.0
    stiffness: 53.0
    damping: 3.4
    armature: 0.01
  ankle_pitch:
    joint_names: [l_ankle_pitch_joint, r_ankle_pitch_joint]
    effort_limit: 9.0
    velocity_limit: 12.0
    stiffness: 8.0
    damping: 0.5
    armature: 0.01
  ankle_roll:
    joint_names: [l_ankle_roll_joint, r_ankle_roll_joint]
    effort_limit: 9.0
    velocity_limit: 12.0
    stiffness: 8.0
    damping: 0.5
    armature: 0.01
  arms:
    joint_names:
      - l_arm_pitch_joint
      - l_arm_roll_joint
      - l_arm_yaw_joint
      - l_elbow_pitch_joint
      - r_arm_pitch_joint
      - r_arm_roll_joint
      - r_arm_yaw_joint
      - r_elbow_pitch_joint
    effort_limit: 4.0
    velocity_limit: 12.0
    stiffness: 8.0
    damping: 0.4
    armature: 0.01

# 与 G1 部署端相同的观测注册方式；顺序严格对应 BUMI3 PolicyCfg，不能仅按总维度重排。
observations:
  - name: his_base_angular_velocity_10frame_step1
    enabled: true
  - name: his_body_joint_positions_10frame_step1
    enabled: true
  - name: his_body_joint_velocities_10frame_step1
    enabled: true
  - name: his_last_actions_10frame_step1
    enabled: true
  - name: his_gravity_dir_10frame_step1
    enabled: true

# 当前联合 ONNX 在模型内部完成编码和解码，外部直接拼接参考与历史，不额外填 encoder_mode/token。
# dimension 描述训练网络内部的 token 维度，不是当前部署模型的输入维度。
encoder:
  dimension: 64
  encoder_observations:
    - name: motion_joint_positions_10frame_step5
      enabled: true
    - name: motion_joint_velocities_10frame_step5
      enabled: true
    - name: motion_anchor_orientation_10frame_step5
      enabled: true
    - name: smpl_joints_10frame_step1
      enabled: true
    - name: smpl_anchor_orientation_10frame_step1
      enabled: true
  encoder_modes:
    - name: robot
      mode_id: 0
      required_observations:
        - motion_joint_positions_10frame_step5
        - motion_joint_velocities_10frame_step5
        - motion_anchor_orientation_10frame_step5
    - name: smpl
      mode_id: 1
      required_observations:
        - smpl_joints_10frame_step1
        - smpl_anchor_orientation_10frame_step1
